# Language: C++23 on the minimal C++ library, no exceptions/RTTI.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_MINIMAL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
# Containers/utilities in place of the STL the minimal library lacks.
CONFIG_ETL=y

# Bring-up is driven interactively from the ST-LINK virtual COM port.
CONFIG_SHELL=y
CONFIG_LOG=y

# Peripherals exercised by the bring-up commands.
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_SENSOR=y

# Bring-up reads the battery / current ADC channels raw, to show both the
# pin voltage and the scaled value; the upstream drivers are not needed.
CONFIG_VOLTAGE_DIVIDER=n
CONFIG_CURRENT_AMP=n

# BLE link test: a Nordic UART Service peripheral (see src/ble.cpp).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_DEVICE_NAME="wallckr-bringup"
CONFIG_BT_HCI_ERR_TO_STR=y
