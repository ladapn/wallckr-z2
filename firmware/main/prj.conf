# Language: C++23 on the minimal C++ library, no exceptions/RTTI.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_MINIMAL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
# Containers/utilities in place of the STL the minimal library lacks.
CONFIG_ETL=y

# Log output on the ST-LINK virtual COM port.
CONFIG_LOG=y

# Peripherals behind the IMotorController, ISteeringServo, IDistanceSensor,
# IBatterySensor, ICurrentSensor and IRobotIndicators adapters.
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y

# The battery / current channels are read raw and scaled by the adapters
# (lib/ expects mV at the ADC pin); the upstream drivers are not needed.
CONFIG_VOLTAGE_DIVIDER=n
CONFIG_CURRENT_AMP=n

# ovladacka commands and telemetry over the Nordic UART Service.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_DEVICE_NAME="wallckr"
# Let the phone negotiate a 247-byte ATT MTU, so a tick's telemetry fits one
# notification (see ZephyrNusStream).
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Control thread: main() waits on the tick timer and NUS command events.
CONFIG_EVENTS=y
# main() holds the robot objects (~1.1 KB frame) and calls down into the
# sensor, ADC and Bluetooth drivers.
CONFIG_MAIN_STACK_SIZE=4096
